openapi: 3.0.3
info:
  title: Proyecto Integrador API
  version: 1.0.0
  description: API REST para gestionar Authors, Posts y Comments.
  contact:
    name: Lucia Lemes
    email: lemeslucya@gmail.com

servers:
  - url: http://localhost:3000
    description: Servidor local

# -------------------------
# Declaración global de tags
# -------------------------
tags:
  - name: Authors
    description: Operaciones relacionadas con autores
  - name: Posts
    description: Operaciones relacionadas con posts
  - name: Comments
    description: Operaciones relacionadas con comentarios

paths:
  # ======================
  # AUTHORS
  # ======================
  /authors:
    get:
      summary: Listar todos los autores
      tags: [Authors]
      responses:
        '200':
          description: Lista de autores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
    post:
      summary: Crear un autor
      tags: [Authors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '201':
          description: Autor creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Error de validación

  /authors/{id}:
    get:
      summary: Obtener un autor por ID
      tags: [Authors]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID del autor
      responses:
        '200':
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: Autor no encontrado
    put:
      summary: Actualizar un autor
      tags: [Authors]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '200':
          description: Autor actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: Autor no encontrado
        '400':
          description: Error de validación
    delete:
      summary: Eliminar un autor
      tags: [Authors]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Autor eliminado
        '404':
          description: Autor no encontrado

  # ======================
  # POSTS
  # ======================
  /posts:
    get:
      summary: Listar todos los posts
      tags: [Posts]
      responses:
        '200':
          description: Lista de posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    post:
      summary: Crear un post
      tags: [Posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Post creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Error de validación

  /posts/{id}:
    get:
      summary: Obtener un post por ID
      tags: [Posts]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Post encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post no encontrado
    put:
      summary: Actualizar un post
      tags: [Posts]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: Post actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post no encontrado
        '400':
          description: Error de validación
    delete:
      summary: Eliminar un post
      tags: [Posts]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Post eliminado
        '404':
          description: Post no encontrado

  /posts/author/{authorId}:
    get:
      summary: Listar posts de un autor
      tags: [Posts]
      parameters:
        - in: path
          name: authorId
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Lista de posts del autor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '404':
          description: No se encontraron posts

  # ======================
  # COMMENTS
  # ======================
  /comments:
    get:
      summary: Listar todos los comentarios
      tags: [Comments]
      responses:
        '200':
          description: Lista de comentarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
    post:
      summary: Crear un comentario
      tags: [Comments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Comentario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Error de validación

  /comments/{id}:
    get:
      summary: Obtener un comentario por ID
      tags: [Comments]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Comentario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          description: Comentario no encontrado
    put:
      summary: Actualizar un comentario
      tags: [Comments]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdate'
      responses:
        '200':
          description: Comentario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          description: Comentario no encontrado
        '400':
          description: Error de validación
    delete:
      summary: Eliminar un comentario
      tags: [Comments]
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Comentario eliminado
        '404':
          description: Comentario no encontrado

  /comments/post/{postId}:
    get:
      summary: Listar comentarios de un post
      tags: [Comments]
      parameters:
        - in: path
          name: postId
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Lista de comentarios del post
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'

  /comments/author/{authorId}:
    get:
      summary: Listar comentarios de un autor
      tags: [Comments]
      parameters:
        - in: path
          name: authorId
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Lista de comentarios del autor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'

components:
  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        bio:
          type: string
        created_at:
          type: string
          format: date-time
    AuthorInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
        bio:
          type: string

    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        author_id:
          type: integer
        published:
          type: boolean
        created_at:
          type: string
          format: date-time
    PostInput:
      type: object
      required:
        - title
        - content
        - author_id
      properties:
        title:
          type: string
        content:
          type: string
        author_id:
          type: integer
        published:
          type: boolean

    Comment:
      type: object
      properties:
        id:
          type: integer
        post_id:
          type: integer
        author_id:
          type: integer
        content:
          type: string
        created_at:
          type: string
          format: date-time
    CommentInput:
      type: object
      required:
        - post_id
        - author_id
        - content
      properties:
        post_id:
          type: integer
        author_id:
          type: integer
        content:
          type: string
    CommentUpdate:
      type: object
      required:
        - content
      properties:
        content:
          type: string